min_version = "2026.10.15"

[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.15.0"
"go:github.com/air-verse/air" = "1.67.4"
"go:mvdan.cc/gofumpt" = "0.12.0"

[tasks.dev]
description = "Run the development servers and load the seed data"
depends = ["api:dev", "ui:dev", "dev:seed"]

[tasks."dev:fresh"]
description = "Delete the local database, then run the development servers on a fresh, seeded one"
depends = ["deps:reset"]
run = "mise run dev"

[tasks."dev:seed"]
description = "Load deps/seed.sql once the API has migrated the database (safe to run again)"
depends = ["deps:up"]
env = { _.file = "configs/.dev.env" }
run = '''
set -eu
compose="docker compose --env-file configs/.dev.env -f deps.dev.yaml"
psql() { $compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 "$@"; }

# The API creates the tables on start, so wait for the last ones the seed fills.
attempts=0
until [ "$(psql -tAc "SELECT to_regclass('public.role_bindings') IS NOT NULL AND to_regclass('public.group_members') IS NOT NULL AND to_regclass('public.ingestion_tokens') IS NOT NULL" 2>/dev/null)" = "t" ]; do
  attempts=$((attempts + 1))
  if [ "$attempts" -ge 120 ]; then
    echo "Skipped the seed data: the database tables did not appear within 2 minutes" >&2
    exit 0
  fi
  sleep 1
done

psql -q -v issuer="$GP_OIDC_ISSUER" -v team_token="$GP_DEV_TEAM_DIRECTORY_TOKEN" \
  -v service_token="$GP_DEV_SERVICE_REGISTRY_TOKEN" < deps/seed.sql
echo "Seed data loaded"

# Ask Authentik to push its people and groups over SCIM now, rather than at
# its next scheduled sync. Authentik may still be starting, so this is best effort.
if docker compose --env-file configs/.dev.env -f deps.dev.yaml exec -T authentik-worker ak shell -c "
from authentik.providers.scim.models import SCIMProvider
from authentik.providers.scim.tasks import scim_sync
for provider in SCIMProvider.objects.filter(name='Golden Portal SCIM'):
    scim_sync.send(provider.pk)
" >/dev/null 2>&1; then
  echo "Asked Authentik to sync people and groups over SCIM"
else
  echo "Authentik isn't ready; it will sync people and groups over SCIM on its own schedule"
fi
'''

[tasks."api:dev"]
description = "Run the API with hot reload"
depends = ["deps:up"]
env = { _.file = "configs/.dev.env" }
run = "air --build.cmd 'go build -o .local/tmp/goldenportal ./cmd/goldenportal' --build.bin .local/tmp/goldenportal -tmp_dir .local/tmp --build.exclude_dir 'assets,tmp,vendor,testdata,ui,.local' --misc.clean_on_exit true"

[tasks.build]
description = "Build the UI, then the goldenportal binary that embeds it"
depends = ["ui:build"]
run = "go build ./cmd/goldenportal"

[tasks.dist]
description = "Build the UI, then cross-compile the release binaries into dist/<arch>/goldenportal"
depends = ["ui:build"]
env = { CGO_ENABLED = "0", GOOS = "linux" }
run = '''
set -eu
rm -rf dist
for arch in amd64 arm64; do
  GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/$arch/goldenportal" ./cmd/goldenportal
done
'''

[tasks.image]
description = "Build the container image for both architectures"
depends = ["dist"]
run = "podman build --platform linux/amd64,linux/arm64 --manifest goldenportal:local ."

[tasks."ui:dev"]
description = "Run the Vite dev server on port 47273, proxying /api to the API"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm dev"

[tasks."ui:build"]
description = "Build the UI into internal/web/dist"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm build"

[tasks."ui:check"]
description = "Run Biome checks, lint, and UI tests"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm check && pnpm lint && pnpm test"

[tasks."deps:up"]
description = "Start local Postgres, Authentik and the mock pusher"
env = { _.file = "configs/.dev.env" }
run = '''
set -eu
mkdir -p .local/postgres .local/authentik-postgres
docker compose --env-file configs/.dev.env -f deps.dev.yaml up -d

attempts=0
until docker compose --env-file configs/.dev.env -f deps.dev.yaml exec -T postgres pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; do
  attempts=$((attempts + 1))
  if [ "$attempts" -ge 60 ]; then
    echo "PostgreSQL did not become healthy within 60 seconds" >&2
    exit 1
  fi
  sleep 1
done

echo "PostgreSQL ready. Authentik is starting at http://localhost:47900 (the first start takes a minute)."
'''

[tasks."deps:reset"]
description = "Delete the local Golden Portal database (Authentik keeps its data)"
env = { _.file = "configs/.dev.env" }
run = '''
set -eu
docker compose --env-file configs/.dev.env -f deps.dev.yaml stop postgres >/dev/null 2>&1 || true
docker rm -f "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
# The data belongs to the container's root user, so delete it from a container.
mkdir -p .local/postgres
docker run --rm -v "$PWD/.local/postgres:/data" --entrypoint sh "$POSTGRES_IMAGE" -c 'rm -rf /data/* /data/.[!.]*'
echo "Deleted the local database"
'''

[tasks."deps:down"]
description = "Stop local Postgres, Authentik and the mock pusher"
env = { _.file = "configs/.dev.env" }
run = "docker compose --env-file configs/.dev.env -f deps.dev.yaml down"

[tasks."deps:logs"]
description = "Follow local dependency logs"
env = { _.file = "configs/.dev.env" }
run = "docker compose --env-file configs/.dev.env -f deps.dev.yaml logs -f"

[tasks.fmt]
description = "Format Go source files"
run = "gofumpt -w cmd internal migrations"

[tasks.lint]
description = "Check Go formatting, run go vet, and run the UI checks"
depends = ["ui:check"]
run = '''
set -eu
unformatted="$(gofumpt -l cmd internal migrations)"
if [ -n "$unformatted" ]; then
  echo "gofumpt would change:" >&2
  echo "$unformatted" >&2
  exit 1
fi
go vet ./...
'''

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[settings]
task.output = "interleave"
