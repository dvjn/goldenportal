min_version = "2026.10.15"

[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.15.0"
"go:github.com/air-verse/air" = "1.67.4"
"go:mvdan.cc/gofumpt" = "0.12.0"

[tasks.dev]
description = "Run the development servers"
depends = ["api:dev", "ui:dev"]

[tasks."api:dev"]
description = "Run the API with hot reload"
depends = ["deps:up"]
env = { _.file = ["configs/.dev.env", "configs/.local.env"] }
run = "air --build.cmd 'go build -o .local/tmp/goldport ./cmd/goldport' --build.bin .local/tmp/goldport -tmp_dir .local/tmp --build.exclude_dir 'assets,tmp,vendor,testdata,ui,.local' --misc.clean_on_exit true"

[tasks.build]
description = "Build the UI, then the goldport binary that embeds it"
depends = ["ui:build"]
run = "go build ./cmd/goldport"

[tasks.dist]
description = "Build the UI, then cross-compile the release binaries into dist/<arch>/goldport"
depends = ["ui:build"]
env = { CGO_ENABLED = "0", GOOS = "linux" }
run = '''
set -eu
rm -rf dist
for arch in amd64 arm64; do
  GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/$arch/goldport" ./cmd/goldport
done
'''

[tasks.image]
description = "Build the container image for both architectures"
depends = ["dist"]
run = "podman build --platform linux/amd64,linux/arm64 --manifest goldport:local ."

[tasks."ui:dev"]
description = "Run the Vite dev server on port 47273, proxying /api and /scim to the API"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm dev"

[tasks."ui:build"]
description = "Build the UI into internal/web/dist"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm build"

[tasks."ui:check"]
description = "Run Biome checks, lint, and UI tests"
dir = "ui"
run = "pnpm install --frozen-lockfile && pnpm check && pnpm lint && pnpm test"

[tasks."deps:up"]
description = "Start local Postgres and Authentik"
env = { _.file = "configs/.dev.env" }
run = '''
set -eu
compose() {
  docker compose --env-file configs/.dev.env -f deps.dev.yaml "$@"
}

mkdir -p .local/postgres
compose up -d postgres

attempts=0
until compose exec -T postgres pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; do
  attempts=$((attempts + 1))
  if [ "$attempts" -ge 60 ]; then
    echo "PostgreSQL did not become healthy within 60 seconds" >&2
    exit 1
  fi
  sleep 1
done
echo "PostgreSQL ready"

compose exec -T postgres psql -q -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" \
  -v user="$AUTHENTIK_DB_USER" -v password="$AUTHENTIK_DB_PASSWORD" -v database="$AUTHENTIK_DB_NAME" \
  < configs/postgres/authentik.sql
compose up -d authentik-server authentik-worker

attempts=0
until curl -fsS "${GOLDPORT_OIDC_ISSUER_URL}.well-known/openid-configuration" >/dev/null 2>&1; do
  attempts=$((attempts + 1))
  if [ "$attempts" -ge 180 ]; then
    echo "Authentik did not serve the goldport-local application within 180 seconds" >&2
    exit 1
  fi
  sleep 1
done
echo "Authentik ready: http://localhost:$AUTHENTIK_PORT (akadmin / $AUTHENTIK_BOOTSTRAP_PASSWORD)"
echo "Portal users: alice, bob and cara @example.test / $DEV_USER_PASSWORD"
'''

[tasks."deps:down"]
description = "Stop local Postgres and Authentik"
env = { _.file = "configs/.dev.env" }
run = "docker compose --env-file configs/.dev.env -f deps.dev.yaml down"

[tasks."deps:logs"]
description = "Follow local dependency logs"
env = { _.file = "configs/.dev.env" }
run = "docker compose --env-file configs/.dev.env -f deps.dev.yaml logs -f"

[tasks.fmt]
description = "Format Go source files"
run = "gofumpt -w cmd internal migrations"

[tasks.lint]
description = "Check Go formatting, run go vet, validate the example definitions, and run the UI checks"
depends = ["ui:check"]
run = '''
set -eu
unformatted="$(gofumpt -l cmd internal migrations)"
if [ -n "$unformatted" ]; then
  echo "gofumpt would change:" >&2
  echo "$unformatted" >&2
  exit 1
fi
go vet ./...
go run ./cmd/goldport validate -f examples/definitions
'''

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[settings]
task.output = "interleave"
