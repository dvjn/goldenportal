services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:18.4-bookworm}
    container_name: ${POSTGRES_CONTAINER:-goldenportal-postgres}
    user: root
    environment:
      POSTGRES_USER: ${DB_USER:-goldenportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goldenportal-local-dev-password}
      POSTGRES_DB: ${DB_NAME:-goldenportal}
    ports:
      - "${DB_PORT:-47433}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20

  # Everything else the portal talks to in development: sign-in, an ops API,
  # a deploy tracker, a service registry and a pusher. deps/mock/mock.yaml
  # sets it up.
  mock:
    build: deps/mock
    container_name: goldenportal-mock
    # Reaches the API on the host's localhost, where mise runs it, and serves
    # sign-in on the same localhost address the browser and the API both use.
    network_mode: host
    environment:
      HTTP_PORT: ${HTTP_PORT}
      GP_OIDC_ISSUER: ${GP_OIDC_ISSUER}
      GP_OIDC_CLIENT_ID: ${GP_OIDC_CLIENT_ID}
      GP_OIDC_CLIENT_SECRET: ${GP_OIDC_CLIENT_SECRET}
      GP_DEV_TEAM_DIRECTORY_TOKEN: ${GP_DEV_TEAM_DIRECTORY_TOKEN}
      GP_SECRET_SERVICE_REGISTRY_SIGNING: ${GP_SECRET_SERVICE_REGISTRY_SIGNING}
      GP_SECRET_OPS: ${GP_SECRET_OPS}
      GP_SECRET_DEPLOY_TRACKER: ${GP_SECRET_DEPLOY_TRACKER}
