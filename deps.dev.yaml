services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:18.4-bookworm}
    container_name: ${POSTGRES_CONTAINER:-goldenportal-postgres}
    user: root
    environment:
      POSTGRES_USER: ${DB_USER:-goldenportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goldenportal-local-dev-password}
      POSTGRES_DB: ${DB_NAME:-goldenportal}
    ports:
      - "${DB_PORT:-47433}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20

  # Authentik is the local OIDC provider. deps/authentik/golden-portal.yaml
  # sets up the Golden Portal application and two sign-in accounts.
  authentik-postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:18.4-bookworm}
    container_name: goldenportal-authentik-postgres
    user: root
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-local-dev-password
      POSTGRES_DB: authentik
    volumes:
      - ./.local/authentik-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U authentik -d authentik
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: &authentik-image ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.8.5}
    container_name: goldenportal-authentik-server
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: golden-portal-local-dev-authentik-secret-key-not-for-production
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-local-dev-password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_EMAIL: ${GP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_PASSWORD: golden-portal-dev
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "${AUTHENTIK_PORT:-47900}:9000"
    # Lets Authentik reach the portal's API on the host for SCIM.
    extra_hosts: &authentik-hosts
      - "host.docker.internal:host-gateway"
    volumes: &authentik-volumes
      - ./deps/authentik:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    image: *authentik-image
    container_name: goldenportal-authentik-worker
    command: worker
    environment: *authentik-environment
    extra_hosts: *authentik-hosts
    volumes: *authentik-volumes
    depends_on:
      authentik-postgres:
        condition: service_healthy

  # Pushes example data to the push integrations in deps/seed.sql, as an
  # external system would. deps/mock-pusher has the payloads and the loop.
  mock-pusher:
    image: ${CURL_IMAGE:-docker.io/curlimages/curl:8.17.0}
    container_name: goldenportal-mock-pusher
    # Reaches the API on the host's localhost, where mise runs it.
    network_mode: host
    entrypoint: ["/bin/sh", "/data/push.sh"]
    environment:
      GP_API_URL: http://localhost:${HTTP_PORT:-47200}
      PUSH_INTERVAL: ${MOCK_PUSH_INTERVAL:-60}
      TEAM_DIRECTORY_TOKEN: ${GP_DEV_TEAM_DIRECTORY_TOKEN}
      SERVICE_REGISTRY_TOKEN: ${GP_DEV_SERVICE_REGISTRY_TOKEN}
    volumes:
      - ./deps/mock-pusher:/data:ro

  # A pretend deploy tracker with a JSON API, for the http integration in
  # deps/seed.sql to pull from. deps/mock-deploy-tracker has the server.
  mock-deploy-tracker:
    image: ${BUSYBOX_IMAGE:-docker.io/library/busybox:1.37.0}
    container_name: goldenportal-mock-deploy-tracker
    entrypoint: ["/bin/sh", "/app/serve.sh"]
    environment:
      TICK: ${MOCK_DEPLOY_TICK:-30}
    ports:
      - "${MOCK_DEPLOY_TRACKER_PORT:-47801}:8080"
    volumes:
      - ./deps/mock-deploy-tracker:/app:ro
