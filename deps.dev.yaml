services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    container_name: ${POSTGRES_CONTAINER:-goldenportal-postgres}
    user: root
    environment:
      POSTGRES_USER: ${DB_USER:-goldenportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goldenportal-local-dev-password}
      POSTGRES_DB: ${DB_NAME:-goldenportal}
    ports:
      - "${DB_PORT:-47433}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
