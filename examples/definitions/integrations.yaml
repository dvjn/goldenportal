kind: Integration
identifier: teams
title: Teams
description: Acme's teams, kept in this definition
connector: static
config:
  records:
    team:
      - identifier: engineering
        title: Engineering
        properties:
          email: engineering@example.test
          chat: https://chat.example.test/engineering
          focus: product
      - identifier: platform
        title: Platform
        properties:
          email: platform@example.test
          chat: https://chat.example.test/platform
          focus: platform
        relations:
          parent: engineering
      - identifier: security
        title: Security
        properties:
          email: security@example.test
          focus: security
        relations:
          parent: engineering
mappings:
  - kind: team
    blueprint: team
---
kind: Integration
identifier: ci
title: CI
description: Acme's pipelines push the services they deploy
connector: push
mappings:
  - kind: service
    blueprint: service
    identifier: .name
    title: .display_name // .name
    properties:
      language: .language
      tier: .tier | values | tostring
      lifecycle: '"production"'
    relations:
      owner: .team
      repositories: '[.repository]'
---
kind: Integration
identifier: gitlab
title: GitLab
description: Repositories from Acme's GitLab group
connector: gitlab
interval: 1h
config:
  url: https://gitlab.example.test
  group: acme
secrets:
  token:
    secretRef: GITLAB_TOKEN
mappings:
  - kind: project
    blueprint: repository
    lookups:
      - team
    identifier: .path_with_namespace
    title: .name
    properties:
      url: .web_url
      path: .path_with_namespace
      defaultBranch: .default_branch
      visibility: .visibility
      archived: .archived
      stars: .star_count
      lastActivity: .last_activity_at
      topics: .topics
    relations:
      owner: .namespace.path as $path | [$team[] | select(.identifier == $path) | .identifier] | first
