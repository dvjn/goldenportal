name: 🔁 CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.8

# Caches are saved only from main: PR caches can't be read by other PRs and
# would push main's out of the size-capped cache.
jobs:
  check:
    name: 🔍 Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧰 Install Tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: 📦 Restore Go and pnpm Cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.local/share/pnpm/store
          key: check-${{ runner.os }}-${{ hashFiles('go.sum', 'ui/pnpm-lock.yaml') }}
          restore-keys: |
            check-${{ runner.os }}-
      - name: 🧹 Run Lint
        run: mise run lint
      - name: ✅ Run Tests
        run: mise run test
      - name: 💾 Save Go and pnpm Cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.local/share/pnpm/store
          key: ${{ steps.cache.outputs.cache-primary-key }}

  e2e:
    name: 🐘 Run End-to-End Tests
    runs-on: ubuntu-latest
    # The tests make their own databases on this server.
    services:
      postgres:
        image: docker.io/library/postgres:18.4-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GP_TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres?sslmode=disable
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧰 Install Tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: 📦 Restore Go Cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-${{ runner.os }}-
      - name: ✅ Run End-to-End Tests
        run: mise run test:e2e
      - name: 💾 Save Go Cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    # Builds the same multi-arch image as the release and pushes it only for
    # commits on main. A fork pull request has a read-only token and no secrets.
    name: 🐳 Build Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/goldenportal
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧰 Install Tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: 📦 Restore Go and pnpm Cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.local/share/pnpm/store
          key: dist-${{ runner.os }}-${{ hashFiles('go.sum', 'ui/pnpm-lock.yaml') }}
          restore-keys: |
            dist-${{ runner.os }}-
      - name: 🏗️ Build Binaries
        run: mise run dist
      - name: 💾 Save Go and pnpm Cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.local/share/pnpm/store
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: 🏷️ Generate Image Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
      - name: 🐳 Build Image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: ./Containerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64, linux/arm64
          layers: true
          oci: true
      - name: 🚀 Push to Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
