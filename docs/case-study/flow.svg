<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="The Promote to Production action on a staging deployment: a check that the repository is at silver in Production Readiness, an approval from the owning team, a GitLab call that finds the pipeline&#x27;s manual deploy-production job and one that plays it, a sync of deployments, and an output linking to the job.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="160" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Promote to Production</text>
  <text class="label" x="480" y="68" text-anchor="middle">an action on a successful staging deployment</text>
  <rect class="key" x="30" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="94" y="104.5" text-anchor="middle">check</text>
  <text class="label" x="94" y="120.5" text-anchor="middle">repository at</text>
  <text class="label" x="94" y="136.5" text-anchor="middle">silver readiness</text>
  <rect class="key" x="184" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="248" y="104.5" text-anchor="middle">approval</text>
  <text class="label" x="248" y="120.5" text-anchor="middle">a teammate on</text>
  <text class="label" x="248" y="136.5" text-anchor="middle">the owning team</text>
  <rect class="key" x="339" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="403" y="104.5" text-anchor="middle">http</text>
  <text class="label" x="403" y="120.5" text-anchor="middle">find the pipeline&#x27;s</text>
  <text class="label" x="403" y="136.5" text-anchor="middle">deploy-production job</text>
  <rect class="key" x="493" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="557" y="104.5" text-anchor="middle">http</text>
  <text class="label" x="557" y="120.5" text-anchor="middle">play</text>
  <text class="label" x="557" y="136.5" text-anchor="middle">the job</text>
  <rect class="key" x="648" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="712" y="104.5" text-anchor="middle">sync</text>
  <text class="label" x="712" y="120.5" text-anchor="middle">gitlab</text>
  <text class="label" x="712" y="136.5" text-anchor="middle">deployments</text>
  <rect class="key" x="802" y="80" width="128" height="72" rx="6"/>
  <text class="text" x="866" y="104.5" text-anchor="middle">output</text>
  <text class="label" x="866" y="120.5" text-anchor="middle">link to</text>
  <text class="label" x="866" y="136.5" text-anchor="middle">the job</text>
  <path class="line" d="M158,116 L182,116" marker-end="url(#arrow)"/>
  <path class="line" d="M312,116 L337,116" marker-end="url(#arrow)"/>
  <path class="line" d="M467,116 L491,116" marker-end="url(#arrow)"/>
  <path class="line" d="M621,116 L646,116" marker-end="url(#arrow)"/>
  <path class="line" d="M776,116 L800,116" marker-end="url(#arrow)"/>
  <rect class="box" x="10" y="210" width="940" height="130" rx="10"/>
  <text class="title" x="480" y="238" text-anchor="middle">Where It Lands</text>
  <rect class="chip" x="334" y="254" width="280" height="56" rx="6"/>
  <text class="text" x="474" y="278.5" text-anchor="middle">GitLab</text>
  <text class="label" x="474" y="294.5" text-anchor="middle">deploy-production runs in that pipeline</text>
  <rect class="key" x="694" y="254" width="236" height="56" rx="6"/>
  <text class="text" x="812" y="278.5" text-anchor="middle">Catalog</text>
  <text class="label" x="812" y="294.5" text-anchor="middle">production Deployment, Delivery tab</text>
  <path class="line" d="M403,152 L403,252" marker-end="url(#arrow)"/>
  <text class="label" x="411" y="198" text-anchor="start">API calls</text>
  <path class="line" d="M557,152 L557,252" marker-end="url(#arrow)"/>
  <path class="line" d="M614,282 L692,282" marker-end="url(#arrow)"/>
  <text class="label" x="653" y="275" text-anchor="middle">read by sync</text>
  <path class="line" d="M712,152 L712,252" marker-end="url(#arrow)"/>
  <text class="label" x="720" y="198" text-anchor="start">writes</text>
</svg>
