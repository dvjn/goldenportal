<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="The Upgrade Database action: on PostgreSQL databases below 16 only, it takes a maintenance window, waits for a database administrator&#x27;s approval, starts the upgrade pipeline and links to it; the next inventory push then records the new version and the database passes the migration scorecard.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="160" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Upgrade Database</text>
  <text class="label" x="480" y="68" text-anchor="middle">an action on a database; scope: postgres below 16</text>
  <rect class="chip" x="40" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="130" y="104.5" text-anchor="middle">Inputs</text>
  <text class="label" x="130" y="120.5" text-anchor="middle">maintenance</text>
  <text class="label" x="130" y="136.5" text-anchor="middle">window</text>
  <rect class="key" x="272" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="362" y="104.5" text-anchor="middle">approval</text>
  <text class="label" x="362" y="120.5" text-anchor="middle">dba group,</text>
  <text class="label" x="362" y="136.5" text-anchor="middle">reviews the database</text>
  <rect class="key" x="504" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="594" y="104.5" text-anchor="middle">http</text>
  <text class="label" x="594" y="120.5" text-anchor="middle">start the</text>
  <text class="label" x="594" y="136.5" text-anchor="middle">upgrade pipeline</text>
  <rect class="key" x="736" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="826" y="104.5" text-anchor="middle">output</text>
  <text class="label" x="826" y="120.5" text-anchor="middle">link to the</text>
  <text class="label" x="826" y="136.5" text-anchor="middle">pipeline</text>
  <path class="line" d="M220,116 L270,116" marker-end="url(#arrow)"/>
  <path class="line" d="M452,116 L502,116" marker-end="url(#arrow)"/>
  <path class="line" d="M684,116 L734,116" marker-end="url(#arrow)"/>
  <rect class="box" x="10" y="210" width="940" height="130" rx="10"/>
  <text class="title" x="480" y="238" text-anchor="middle">After the Run</text>
  <rect class="chip" x="40" y="254" width="200" height="64" rx="6"/>
  <text class="text" x="140" y="274.5" text-anchor="middle">GitLab pipeline</text>
  <text class="label" x="140" y="290.5" text-anchor="middle">upgrades the database</text>
  <text class="label" x="140" y="306.5" text-anchor="middle">in its window</text>
  <rect class="chip" x="280" y="254" width="200" height="64" rx="6"/>
  <text class="text" x="380" y="282.5" text-anchor="middle">AWS inventory</text>
  <text class="label" x="380" y="298.5" text-anchor="middle">next scheduled push</text>
  <rect class="key" x="520" y="254" width="180" height="64" rx="6"/>
  <text class="text" x="610" y="274.5" text-anchor="middle">Database</text>
  <text class="label" x="610" y="290.5" text-anchor="middle">engineVersion 16.4,</text>
  <text class="label" x="610" y="306.5" text-anchor="middle">majorVersion 16</text>
  <rect class="key" x="740" y="254" width="190" height="64" rx="6"/>
  <text class="text" x="835" y="282.5" text-anchor="middle">PostgreSQL 16 Upgrade</text>
  <text class="label" x="835" y="298.5" text-anchor="middle">passes: Upgraded</text>
  <path class="line" d="M594,152 L594,200 L140,200 L140,252" marker-end="url(#arrow)"/>
  <text class="label" x="602" y="196" text-anchor="start">starts</text>
  <path class="line" d="M240,286 L278,286" marker-end="url(#arrow)"/>
  <path class="line" d="M480,286 L518,286" marker-end="url(#arrow)"/>
  <text class="label" x="499" y="279" text-anchor="middle">push</text>
  <path class="line" d="M700,286 L738,286" marker-end="url(#arrow)"/>
</svg>
