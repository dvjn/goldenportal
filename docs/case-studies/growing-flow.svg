<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="The Register Service workflow: inputs, a check that the name is free, an entity step that writes the service through the registry connection, and an output linking to it; the next cluster push links workloads labelled with the service&#x27;s name.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="160" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Register Service</text>
  <text class="label" x="480" y="68" text-anchor="middle">a workflow, run from Self-Service</text>
  <rect class="chip" x="30" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="120" y="104.5" text-anchor="middle">Inputs</text>
  <text class="label" x="120" y="120.5" text-anchor="middle">name, owner, repo,</text>
  <text class="label" x="120" y="136.5" text-anchor="middle">tier, runbook</text>
  <rect class="key" x="270" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="360" y="104.5" text-anchor="middle">check</text>
  <text class="label" x="360" y="120.5" text-anchor="middle">no service</text>
  <text class="label" x="360" y="136.5" text-anchor="middle">has the name</text>
  <rect class="key" x="510" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="600" y="104.5" text-anchor="middle">entity</text>
  <text class="label" x="600" y="120.5" text-anchor="middle">upsert service</text>
  <text class="label" x="600" y="136.5" text-anchor="middle">as registry</text>
  <rect class="key" x="750" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="840" y="104.5" text-anchor="middle">output</text>
  <text class="label" x="840" y="120.5" text-anchor="middle">link to the</text>
  <text class="label" x="840" y="136.5" text-anchor="middle">new service</text>
  <path class="line" d="M210,116 L268,116" marker-end="url(#arrow)"/>
  <path class="line" d="M450,116 L508,116" marker-end="url(#arrow)"/>
  <path class="line" d="M690,116 L748,116" marker-end="url(#arrow)"/>
  <rect class="box" x="10" y="210" width="940" height="130" rx="10"/>
  <text class="title" x="480" y="238" text-anchor="middle">Catalog</text>
  <rect class="key" x="390" y="254" width="240" height="64" rx="6"/>
  <text class="text" x="510" y="274.5" text-anchor="middle">Service</text>
  <text class="label" x="510" y="290.5" text-anchor="middle">owner, repository, tier,</text>
  <text class="label" x="510" y="306.5" text-anchor="middle">lifecycle beta</text>
  <rect class="key" x="690" y="254" width="240" height="64" rx="6"/>
  <text class="text" x="810" y="274.5" text-anchor="middle">Workload</text>
  <text class="label" x="810" y="290.5" text-anchor="middle">next kubernetes push, labelled</text>
  <text class="label" x="810" y="306.5" text-anchor="middle">app.kubernetes.io/part-of</text>
  <rect class="chip" x="40" y="254" width="280" height="64" rx="6"/>
  <text class="text" x="180" y="274.5" text-anchor="middle">Kubernetes Baseline</text>
  <text class="label" x="180" y="290.5" text-anchor="middle">scores the new service&#x27;s</text>
  <text class="label" x="180" y="306.5" text-anchor="middle">workloads</text>
  <path class="line" d="M600,152 L600,252" marker-end="url(#arrow)"/>
  <text class="label" x="608" y="198" text-anchor="start">writes</text>
  <path class="line" d="M690,286 L632,286" marker-end="url(#arrow)"/>
  <text class="label" x="661" y="279" text-anchor="middle">service</text>
  <path class="line" d="M390,286 L322,286" marker-end="url(#arrow)"/>
</svg>
