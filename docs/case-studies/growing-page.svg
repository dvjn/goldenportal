<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="A service&#x27;s entity page: the header shows its owner, tier and lifecycle and a runbook link; after Overview, Relations and YAML come Runtime and Delivery tabs; Runtime lists the service&#x27;s workloads across clusters with their Helm chart and Kubernetes Baseline.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="370" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">checkout</text>
  <text class="label" x="480" y="68" text-anchor="middle">Payments</text>
  <rect class="chip" x="600" y="34" width="96" height="30" rx="6"/>
  <text class="text" x="648" y="53.5" text-anchor="middle">Critical</text>
  <rect class="chip" x="710" y="34" width="96" height="30" rx="6"/>
  <text class="text" x="758" y="53.5" text-anchor="middle">Production</text>
  <rect class="chip" x="820" y="34" width="96" height="30" rx="6"/>
  <text class="text" x="868" y="53.5" text-anchor="middle">Runbook</text>
  <rect class="chip" x="30" y="84" width="106" height="32" rx="6"/>
  <text class="text" x="83" y="104.5" text-anchor="middle">Overview</text>
  <rect class="chip" x="148" y="84" width="106" height="32" rx="6"/>
  <text class="text" x="201" y="104.5" text-anchor="middle">Relations</text>
  <rect class="chip" x="266" y="84" width="106" height="32" rx="6"/>
  <text class="text" x="319" y="104.5" text-anchor="middle">YAML</text>
  <rect class="key" x="384" y="84" width="106" height="32" rx="6"/>
  <text class="text" x="437" y="104.5" text-anchor="middle">Runtime</text>
  <rect class="chip" x="502" y="84" width="106" height="32" rx="6"/>
  <text class="text" x="555" y="104.5" text-anchor="middle">Delivery</text>
  <text class="label" x="630" y="104" text-anchor="start">built-in, then the blueprint&#x27;s tabs</text>
  <rect class="chip" x="30" y="132" width="900" height="240" rx="6"/>
  <text class="text" x="48" y="158" text-anchor="start">Workloads</text>
  <text class="label" x="48" y="176" text-anchor="start">query: workloads whose service is this entity</text>
  <text class="label" x="48" y="206" text-anchor="start">Workload</text>
  <text class="label" x="360" y="206" text-anchor="start">Ready</text>
  <text class="label" x="480" y="206" text-anchor="start">Replicas</text>
  <text class="label" x="620" y="206" text-anchor="start">Chart</text>
  <text class="label" x="780" y="206" text-anchor="start">Kubernetes Baseline</text>
  <rect class="key" x="40" y="216" width="880" height="26" rx="4"/>
  <text class="text" x="48" y="234" text-anchor="start">checkout-api (production)</text>
  <text class="text" x="360" y="234" text-anchor="start">3</text>
  <text class="text" x="480" y="234" text-anchor="start">3</text>
  <text class="text" x="620" y="234" text-anchor="start">acme-service-4.1.0</text>
  <text class="text" x="780" y="234" text-anchor="start">Baseline</text>
  <rect class="chip" x="40" y="246" width="880" height="26" rx="4"/>
  <text class="text" x="48" y="264" text-anchor="start">checkout-worker (production)</text>
  <text class="text" x="360" y="264" text-anchor="start">2</text>
  <text class="text" x="480" y="264" text-anchor="start">2</text>
  <text class="text" x="620" y="264" text-anchor="start">acme-service-4.1.0</text>
  <text class="text" x="780" y="264" text-anchor="start">Baseline</text>
  <rect class="chip" x="40" y="276" width="880" height="26" rx="4"/>
  <text class="text" x="48" y="294" text-anchor="start">checkout-api (staging)</text>
  <text class="text" x="360" y="294" text-anchor="start">1</text>
  <text class="text" x="480" y="294" text-anchor="start">1</text>
  <text class="text" x="620" y="294" text-anchor="start">acme-service-4.1.0</text>
  <text class="text" x="780" y="294" text-anchor="start">Baseline</text>
  <rect class="chip" x="40" y="306" width="880" height="26" rx="4"/>
  <text class="text" x="48" y="324" text-anchor="start">checkout-api (dev)</text>
  <text class="text" x="360" y="324" text-anchor="start">1</text>
  <text class="text" x="480" y="324" text-anchor="start">1</text>
  <text class="text" x="620" y="324" text-anchor="start">acme-service-3.9.2</text>
  <text class="text" x="780" y="324" text-anchor="start">-</text>
  <text class="label" x="48" y="360" text-anchor="start">each row opens its workload&#x27;s page, with its image, replicas and checks</text>
</svg>
