<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The getting-started catalog: repositories from GitLab belong to teams from GitLab groups; AWS resources from the inventory push link to their repository through a tag and to their AWS account.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="300" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Catalog</text>
  <text class="label" x="480" y="68" text-anchor="middle">each blueprint, the connection that fills it, and its relations</text>
  <rect class="key" x="80" y="90" width="200" height="56" rx="6"/>
  <text class="text" x="180" y="114.5" text-anchor="middle">Team</text>
  <text class="label" x="180" y="130.5" text-anchor="middle">from gitlab (groups)</text>
  <rect class="key" x="80" y="210" width="200" height="56" rx="6"/>
  <text class="text" x="180" y="234.5" text-anchor="middle">Repository</text>
  <text class="label" x="180" y="250.5" text-anchor="middle">from gitlab (projects)</text>
  <rect class="key" x="380" y="210" width="200" height="56" rx="6"/>
  <text class="text" x="480" y="234.5" text-anchor="middle">AWS Resource</text>
  <text class="label" x="480" y="250.5" text-anchor="middle">from aws (push)</text>
  <rect class="key" x="680" y="210" width="200" height="56" rx="6"/>
  <text class="text" x="780" y="234.5" text-anchor="middle">AWS Account</text>
  <text class="label" x="780" y="250.5" text-anchor="middle">from aws (push)</text>
  <path class="line" d="M180,210 L180,148" marker-end="url(#arrow)"/>
  <text class="label" x="188" y="183" text-anchor="start">owner</text>
  <path class="line" d="M380,238 L282,238" marker-end="url(#arrow)"/>
  <text class="label" x="331" y="231" text-anchor="middle">repository</text>
  <path class="line" d="M580,238 L678,238" marker-end="url(#arrow)"/>
  <text class="label" x="629" y="231" text-anchor="middle">account</text>
  <text class="label" x="480" y="292" text-anchor="middle">ECS services, Lambda functions, RDS databases, S3 buckets</text>
  <text class="label" x="330" y="199" text-anchor="middle">from its repository tag</text>
</svg>
