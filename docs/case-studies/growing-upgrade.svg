<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="The Upgrade Repositories workflow: inputs pick repositories and an upgrade; an action step runs Open Upgrade on each, which starts the platform&#x27;s upgrader pipeline; the upgrader opens a merge request; once merged, the next GitLab sync reads the new CI templates version and the repository passes the upgrade scorecard.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="160" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Upgrade Repositories</text>
  <text class="label" x="480" y="68" text-anchor="middle">a workflow, run from Self-Service</text>
  <rect class="chip" x="30" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="120" y="104.5" text-anchor="middle">Inputs</text>
  <text class="label" x="120" y="120.5" text-anchor="middle">repositories,</text>
  <text class="label" x="120" y="136.5" text-anchor="middle">upgrade</text>
  <rect class="key" x="270" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="360" y="104.5" text-anchor="middle">action</text>
  <text class="label" x="360" y="120.5" text-anchor="middle">Open Upgrade on</text>
  <text class="label" x="360" y="136.5" text-anchor="middle">each repository</text>
  <rect class="key" x="510" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="600" y="104.5" text-anchor="middle">http</text>
  <text class="label" x="600" y="120.5" text-anchor="middle">start the</text>
  <text class="label" x="600" y="136.5" text-anchor="middle">upgrader pipeline</text>
  <rect class="key" x="750" y="80" width="180" height="72" rx="6"/>
  <text class="text" x="840" y="104.5" text-anchor="middle">output</text>
  <text class="label" x="840" y="120.5" text-anchor="middle">how many started,</text>
  <text class="label" x="840" y="136.5" text-anchor="middle">how many failed</text>
  <path class="line" d="M210,116 L268,116" marker-end="url(#arrow)"/>
  <path class="line" d="M450,116 L508,116" marker-end="url(#arrow)"/>
  <path class="line" d="M690,116 L748,116" marker-end="url(#arrow)"/>
  <rect class="box" x="10" y="210" width="940" height="130" rx="10"/>
  <text class="title" x="480" y="238" text-anchor="middle">After the Run</text>
  <rect class="chip" x="40" y="254" width="200" height="64" rx="6"/>
  <text class="text" x="140" y="274.5" text-anchor="middle">Upgrader pipeline</text>
  <text class="label" x="140" y="290.5" text-anchor="middle">edits the version, opens</text>
  <text class="label" x="140" y="306.5" text-anchor="middle">a merge request</text>
  <rect class="chip" x="280" y="254" width="190" height="64" rx="6"/>
  <text class="text" x="375" y="282.5" text-anchor="middle">Team merges</text>
  <text class="label" x="375" y="298.5" text-anchor="middle">after review</text>
  <rect class="key" x="510" y="254" width="190" height="64" rx="6"/>
  <text class="text" x="605" y="274.5" text-anchor="middle">Repository</text>
  <text class="label" x="605" y="290.5" text-anchor="middle">next gitlab sync:</text>
  <text class="label" x="605" y="306.5" text-anchor="middle">ciTemplate v4.0.1</text>
  <rect class="key" x="740" y="254" width="190" height="64" rx="6"/>
  <text class="text" x="835" y="282.5" text-anchor="middle">CI Templates v4</text>
  <text class="label" x="835" y="298.5" text-anchor="middle">passes: Upgraded</text>
  <path class="line" d="M600,152 L600,200 L140,200 L140,252" marker-end="url(#arrow)"/>
  <text class="label" x="608" y="196" text-anchor="start">starts</text>
  <path class="line" d="M240,286 L278,286" marker-end="url(#arrow)"/>
  <path class="line" d="M470,286 L508,286" marker-end="url(#arrow)"/>
  <text class="label" x="489" y="279" text-anchor="middle">sync</text>
  <path class="line" d="M700,286 L738,286" marker-end="url(#arrow)"/>
</svg>
