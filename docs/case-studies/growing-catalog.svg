<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The growing catalog: services from the registry are owned by teams from authentik, which sit in domains, and point at their repository; repositories link to their SonarQube code quality and their team; pipelines, jobs and deployments from GitLab link to repositories; workloads from the clusters link to their service and cluster.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="440" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Catalog</text>
  <text class="label" x="480" y="68" text-anchor="middle">each blueprint, the connection that fills it, and its relations</text>
  <rect class="key" x="40" y="90" width="170" height="56" rx="6"/>
  <text class="text" x="125" y="114.5" text-anchor="middle">Code Quality</text>
  <text class="label" x="125" y="130.5" text-anchor="middle">from sonarqube</text>
  <rect class="key" x="270" y="90" width="170" height="56" rx="6"/>
  <text class="text" x="355" y="114.5" text-anchor="middle">Team</text>
  <text class="label" x="355" y="130.5" text-anchor="middle">from authentik</text>
  <rect class="key" x="500" y="90" width="170" height="56" rx="6"/>
  <text class="text" x="585" y="114.5" text-anchor="middle">Domain</text>
  <text class="label" x="585" y="130.5" text-anchor="middle">from registry</text>
  <rect class="key" x="40" y="190" width="170" height="56" rx="6"/>
  <text class="text" x="125" y="214.5" text-anchor="middle">Repository</text>
  <text class="label" x="125" y="230.5" text-anchor="middle">from gitlab</text>
  <rect class="key" x="270" y="190" width="170" height="56" rx="6"/>
  <text class="text" x="355" y="214.5" text-anchor="middle">Service</text>
  <text class="label" x="355" y="230.5" text-anchor="middle">from registry</text>
  <rect class="key" x="500" y="190" width="170" height="56" rx="6"/>
  <text class="text" x="585" y="214.5" text-anchor="middle">Workload</text>
  <text class="label" x="585" y="230.5" text-anchor="middle">from kubernetes</text>
  <rect class="key" x="730" y="190" width="170" height="56" rx="6"/>
  <text class="text" x="815" y="214.5" text-anchor="middle">Cluster</text>
  <text class="label" x="815" y="230.5" text-anchor="middle">from kubernetes</text>
  <rect class="key" x="40" y="290" width="170" height="56" rx="6"/>
  <text class="text" x="125" y="314.5" text-anchor="middle">Pipeline</text>
  <text class="label" x="125" y="330.5" text-anchor="middle">from gitlab</text>
  <rect class="key" x="270" y="290" width="170" height="56" rx="6"/>
  <text class="text" x="355" y="314.5" text-anchor="middle">Deployment</text>
  <text class="label" x="355" y="330.5" text-anchor="middle">from gitlab</text>
  <rect class="key" x="40" y="390" width="170" height="56" rx="6"/>
  <text class="text" x="125" y="414.5" text-anchor="middle">Job</text>
  <text class="label" x="125" y="430.5" text-anchor="middle">from gitlab</text>
  <path class="line" d="M125,190 L125,148" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="173" text-anchor="start">quality</text>
  <path class="line" d="M210,190 L270,148" marker-end="url(#arrow)"/>
  <text class="label" x="222" y="166" text-anchor="start">owner</text>
  <path class="line" d="M355,190 L355,148" marker-end="url(#arrow)"/>
  <text class="label" x="363" y="173" text-anchor="start">owner</text>
  <path class="line" d="M440,118 L498,118" marker-end="url(#arrow)"/>
  <text class="label" x="469" y="111" text-anchor="middle">domain</text>
  <path class="line" d="M270,218 L212,218" marker-end="url(#arrow)"/>
  <text class="label" x="241" y="211" text-anchor="middle">repository</text>
  <path class="line" d="M500,218 L442,218" marker-end="url(#arrow)"/>
  <text class="label" x="471" y="211" text-anchor="middle">service</text>
  <path class="line" d="M670,218 L728,218" marker-end="url(#arrow)"/>
  <text class="label" x="699" y="211" text-anchor="middle">cluster</text>
  <path class="line" d="M125,290 L125,248" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="273" text-anchor="start">repository</text>
  <path class="line" d="M125,390 L125,348" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="373" text-anchor="start">pipeline</text>
  <path class="line" d="M270,290 L210,248" marker-end="url(#arrow)"/>
  <text class="label" x="278" y="280" text-anchor="start">repository</text>
  <text class="label" x="615" y="340" text-anchor="start">a workload is one service in one cluster;</text>
  <text class="label" x="615" y="356" text-anchor="start">it carries its Helm chart version</text>
</svg>
