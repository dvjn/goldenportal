<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-label="GitLab is pulled every 15 minutes; a scheduled GitLab pipeline reads every AWS account with the aws CLI and pushes the inventory to the ingest API; each connection fills its blueprints.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="260" height="252" rx="10"/>
  <text class="title" x="140" y="48" text-anchor="middle">Systems</text>
  <text class="label" x="140" y="68" text-anchor="middle">where the data lives</text>
  <rect class="box" x="340" y="20" width="250" height="252" rx="10"/>
  <text class="title" x="465" y="48" text-anchor="middle">Connections</text>
  <text class="label" x="465" y="68" text-anchor="middle">connector + how it syncs</text>
  <rect class="box" x="660" y="20" width="290" height="252" rx="10"/>
  <text class="title" x="805" y="48" text-anchor="middle">Blueprints</text>
  <text class="label" x="805" y="68" text-anchor="middle">what the data becomes</text>
  <rect class="chip" x="25" y="76" width="230" height="56" rx="6"/>
  <text class="text" x="140" y="100.5" text-anchor="middle">GitLab</text>
  <text class="label" x="140" y="116.5" text-anchor="middle">groups and projects</text>
  <rect class="key" x="355" y="76" width="220" height="56" rx="6"/>
  <text class="text" x="465" y="100.5" text-anchor="middle">gitlab</text>
  <text class="label" x="465" y="116.5" text-anchor="middle">pull, every 15m</text>
  <rect class="key" x="675" y="76" width="260" height="56" rx="6"/>
  <text class="text" x="805" y="108.5" text-anchor="middle">Team, Repository</text>
  <path class="line" d="M255,104 L353,104" marker-end="url(#arrow)"/>
  <text class="label" x="304" y="97" text-anchor="middle">pull</text>
  <path class="line" d="M575,104 L673,104" marker-end="url(#arrow)"/>
  <rect class="chip" x="25" y="144" width="230" height="84" rx="6"/>
  <text class="text" x="140" y="174.5" text-anchor="middle">AWS accounts</text>
  <text class="label" x="140" y="190.5" text-anchor="middle">read by a scheduled</text>
  <text class="label" x="140" y="206.5" text-anchor="middle">GitLab pipeline (aws CLI)</text>
  <rect class="key" x="355" y="144" width="220" height="84" rx="6"/>
  <text class="text" x="465" y="174.5" text-anchor="middle">aws (http)</text>
  <text class="label" x="465" y="190.5" text-anchor="middle">push, ?mode=complete</text>
  <text class="label" x="465" y="206.5" text-anchor="middle">token from its Push tab</text>
  <rect class="key" x="675" y="144" width="260" height="84" rx="6"/>
  <text class="text" x="805" y="182.5" text-anchor="middle">AWS Account,</text>
  <text class="label" x="805" y="198.5" text-anchor="middle">AWS Resource</text>
  <path class="line" d="M255,186 L353,186" marker-end="url(#arrow)"/>
  <text class="label" x="304" y="179" text-anchor="middle">push</text>
  <path class="line" d="M575,186 L673,186" marker-end="url(#arrow)"/>
</svg>
