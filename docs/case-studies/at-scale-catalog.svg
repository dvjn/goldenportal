<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="The at-scale catalog: domains belong to business units, teams and systems to domains, services to systems and teams; APIs name a providing and consuming services; databases link to a service and an AWS account; incidents from PagerDuty link to a service, postmortems to an incident, and production changes to a service; Jira issues link to a service, merge requests to a repository.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="20" width="940" height="540" rx="10"/>
  <text class="title" x="480" y="48" text-anchor="middle">Catalog</text>
  <text class="label" x="480" y="68" text-anchor="middle">each blueprint, the connection that fills it, and its relations</text>
  <rect class="key" x="45" y="90" width="160" height="56" rx="6"/>
  <text class="text" x="125" y="114.5" text-anchor="middle">Business Unit</text>
  <text class="label" x="125" y="130.5" text-anchor="middle">from org</text>
  <rect class="key" x="285" y="90" width="160" height="56" rx="6"/>
  <text class="text" x="365" y="114.5" text-anchor="middle">Domain</text>
  <text class="label" x="365" y="130.5" text-anchor="middle">from org</text>
  <rect class="key" x="45" y="190" width="160" height="56" rx="6"/>
  <text class="text" x="125" y="214.5" text-anchor="middle">AWS Account</text>
  <text class="label" x="125" y="230.5" text-anchor="middle">from aws (push)</text>
  <rect class="key" x="285" y="190" width="160" height="56" rx="6"/>
  <text class="text" x="365" y="214.5" text-anchor="middle">System</text>
  <text class="label" x="365" y="230.5" text-anchor="middle">from registry</text>
  <rect class="key" x="525" y="90" width="160" height="56" rx="6"/>
  <text class="text" x="605" y="114.5" text-anchor="middle">Team</text>
  <text class="label" x="605" y="130.5" text-anchor="middle">from authentik</text>
  <rect class="key" x="525" y="190" width="160" height="56" rx="6"/>
  <text class="text" x="605" y="214.5" text-anchor="middle">Issue</text>
  <text class="label" x="605" y="230.5" text-anchor="middle">from jira</text>
  <rect class="key" x="45" y="290" width="160" height="56" rx="6"/>
  <text class="text" x="125" y="314.5" text-anchor="middle">Database</text>
  <text class="label" x="125" y="330.5" text-anchor="middle">from aws (push)</text>
  <rect class="key" x="285" y="290" width="160" height="56" rx="6"/>
  <text class="text" x="365" y="314.5" text-anchor="middle">Service</text>
  <text class="label" x="365" y="330.5" text-anchor="middle">from registry</text>
  <rect class="key" x="525" y="290" width="160" height="56" rx="6"/>
  <text class="text" x="605" y="314.5" text-anchor="middle">Incident</text>
  <text class="label" x="605" y="330.5" text-anchor="middle">from pagerduty</text>
  <rect class="key" x="765" y="290" width="160" height="56" rx="6"/>
  <text class="text" x="845" y="314.5" text-anchor="middle">Postmortem</text>
  <text class="label" x="845" y="330.5" text-anchor="middle">from ops (actions)</text>
  <rect class="key" x="45" y="385" width="160" height="56" rx="6"/>
  <text class="text" x="125" y="409.5" text-anchor="middle">Repository, Workload,</text>
  <text class="label" x="125" y="425.5" text-anchor="middle">... as in Growing</text>
  <rect class="key" x="45" y="480" width="160" height="56" rx="6"/>
  <text class="text" x="125" y="504.5" text-anchor="middle">Merge Request</text>
  <text class="label" x="125" y="520.5" text-anchor="middle">from gitlab</text>
  <rect class="key" x="285" y="385" width="160" height="56" rx="6"/>
  <text class="text" x="365" y="409.5" text-anchor="middle">API</text>
  <text class="label" x="365" y="425.5" text-anchor="middle">from gateway</text>
  <rect class="key" x="525" y="385" width="160" height="56" rx="6"/>
  <text class="text" x="605" y="409.5" text-anchor="middle">Change</text>
  <text class="label" x="605" y="425.5" text-anchor="middle">from ops (actions)</text>
  <path class="line" d="M285,118 L207,118" marker-end="url(#arrow)"/>
  <text class="label" x="246" y="111" text-anchor="middle">businessUnit</text>
  <path class="line" d="M125,190 L125,148" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="173" text-anchor="start">businessUnit</text>
  <path class="line" d="M365,190 L365,148" marker-end="url(#arrow)"/>
  <text class="label" x="373" y="173" text-anchor="start">domain</text>
  <path class="line" d="M525,118 L447,118" marker-end="url(#arrow)"/>
  <text class="label" x="486" y="111" text-anchor="middle">domain</text>
  <path class="line" d="M365,290 L365,248" marker-end="url(#arrow)"/>
  <text class="label" x="373" y="273" text-anchor="start">system</text>
  <path class="line" d="M440,290 L523,148" marker-end="url(#arrow)"/>
  <text class="label" x="498" y="172" text-anchor="start">owner</text>
  <path class="line" d="M525,232 L447,302" marker-end="url(#arrow)"/>
  <text class="label" x="494" y="272" text-anchor="start">service</text>
  <path class="line" d="M125,290 L125,248" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="273" text-anchor="start">account</text>
  <path class="line" d="M205,318 L283,318" marker-end="url(#arrow)"/>
  <text class="label" x="244" y="311" text-anchor="middle">service</text>
  <path class="line" d="M525,318 L447,318" marker-end="url(#arrow)"/>
  <text class="label" x="486" y="311" text-anchor="middle">service</text>
  <path class="line" d="M765,318 L687,318" marker-end="url(#arrow)"/>
  <text class="label" x="726" y="311" text-anchor="middle">incident</text>
  <path class="line" d="M365,385 L365,348" marker-end="url(#arrow)"/>
  <text class="label" x="357" y="372" text-anchor="end">provider, consumers</text>
  <path class="line" d="M525,385 L445,348" marker-end="url(#arrow)"/>
  <text class="label" x="494" y="374" text-anchor="start">service</text>
  <path class="line" d="M205,385 L285,348" marker-end="url(#arrow)"/>
  <text class="label" x="222" y="372" text-anchor="end">service</text>
  <path class="line" d="M125,480 L125,443" marker-end="url(#arrow)"/>
  <text class="label" x="133" y="465.5" text-anchor="start">repository</text>
</svg>
