<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Systems feed connections, whose data blueprints turn into catalog entities, which scorecards, dashboards, entity pages and actions read.">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1; }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    .title { fill: #1f2328; font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: italic 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chip { fill: #0d1117; stroke: #6e7681; }
      .key { fill: #0c2d4a; stroke: #4493f8; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .title, .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Systems -->
  <rect class="box" x="10" y="20" width="180" height="326" rx="10"/>
  <text class="title" x="100" y="48" text-anchor="middle">Systems</text>
  <text class="label" x="100" y="68" text-anchor="middle">your tools</text>
  <rect class="chip" x="25" y="88" width="150" height="32" rx="6"/><text class="text" x="100" y="109" text-anchor="middle">GitLab</text>
  <rect class="chip" x="25" y="128" width="150" height="32" rx="6"/><text class="text" x="100" y="149" text-anchor="middle">SonarQube</text>
  <rect class="chip" x="25" y="168" width="150" height="32" rx="6"/><text class="text" x="100" y="189" text-anchor="middle">authentik</text>
  <rect class="chip" x="25" y="208" width="150" height="32" rx="6"/><text class="text" x="100" y="229" text-anchor="middle">Incident tracker API</text>
  <rect class="chip" x="25" y="248" width="150" height="32" rx="6"/><text class="text" x="100" y="269" text-anchor="middle">CI scanner</text>

  <!-- Connections -->
  <rect class="box" x="250" y="20" width="180" height="326" rx="10"/>
  <text class="title" x="340" y="48" text-anchor="middle">Connections</text>
  <text class="label" x="340" y="68" text-anchor="middle">connector + schedule</text>
  <rect class="key" x="265" y="88" width="150" height="32" rx="6"/><text class="text" x="340" y="109" text-anchor="middle">gitlab</text>
  <rect class="key" x="265" y="128" width="150" height="32" rx="6"/><text class="text" x="340" y="149" text-anchor="middle">sonarqube</text>
  <rect class="key" x="265" y="168" width="150" height="32" rx="6"/><text class="text" x="340" y="189" text-anchor="middle">authentik</text>
  <rect class="key" x="265" y="208" width="150" height="32" rx="6"/><text class="text" x="340" y="229" text-anchor="middle">incidents (http)</text>
  <rect class="key" x="265" y="248" width="150" height="32" rx="6"/><text class="text" x="340" y="269" text-anchor="middle">scanner (push)</text>

  <!-- Blueprints -->
  <rect class="box" x="490" y="20" width="190" height="326" rx="10"/>
  <text class="title" x="585" y="48" text-anchor="middle">Blueprints</text>
  <text class="label" x="585" y="68" text-anchor="middle">properties + sources (jq)</text>
  <rect class="key" x="505" y="88" width="160" height="32" rx="6"/><text class="text" x="585" y="109" text-anchor="middle">Repository</text>
  <rect class="key" x="505" y="128" width="160" height="32" rx="6"/><text class="text" x="585" y="149" text-anchor="middle">Pipeline</text>
  <rect class="key" x="505" y="168" width="160" height="32" rx="6"/><text class="text" x="585" y="189" text-anchor="middle">Team, Person</text>
  <rect class="key" x="505" y="208" width="160" height="32" rx="6"/><text class="text" x="585" y="229" text-anchor="middle">Incident</text>
  <rect class="key" x="505" y="248" width="160" height="32" rx="6"/><text class="text" x="585" y="269" text-anchor="middle">Finding</text>
  <text class="label" x="585" y="316" text-anchor="middle">entities fill the catalog</text>

  <!-- Uses -->
  <rect class="box" x="740" y="20" width="210" height="326" rx="10"/>
  <text class="title" x="845" y="48" text-anchor="middle">Uses</text>
  <text class="label" x="845" y="68" text-anchor="middle">read the catalog</text>
  <rect class="key" x="755" y="88" width="180" height="32" rx="6"/><text class="text" x="845" y="109" text-anchor="middle">Scorecard: Readiness</text>
  <rect class="key" x="755" y="128" width="180" height="32" rx="6"/><text class="text" x="845" y="149" text-anchor="middle">Dashboard: Team Overview</text>
  <rect class="key" x="755" y="168" width="180" height="32" rx="6"/><text class="text" x="845" y="189" text-anchor="middle">Entity page tabs</text>
  <rect class="key" x="755" y="208" width="180" height="32" rx="6"/><text class="text" x="845" y="229" text-anchor="middle">Actions, Workflows</text>

  <!-- Flow -->
  <path class="line" d="M192,183 L248,183" marker-end="url(#arrow)"/>
  <text class="label" x="220" y="174" text-anchor="middle">pull / push</text>
  <path class="line" d="M432,183 L488,183" marker-end="url(#arrow)"/>
  <text class="label" x="460" y="174" text-anchor="middle">objects</text>
  <path class="line" d="M682,183 L738,183" marker-end="url(#arrow)"/>
  <text class="label" x="710" y="174" text-anchor="middle">entities</text>
</svg>
