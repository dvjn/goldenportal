# Local development only. Creates the Golden Portal OIDC application in
# Authentik and the dev accounts and groups below. The admin account
# (akadmin) comes from AUTHENTIK_BOOTSTRAP_EMAIL and
# AUTHENTIK_BOOTSTRAP_PASSWORD in deps.dev.yaml. deps/seed.sql loads the
# same people and groups into the portal, so keep the two in step.
version: 1
metadata:
  name: Golden Portal local development
entries:
  # Authentik's built-in email mapping always sends email_verified: false.
  # Golden Portal only grants GP_BOOTSTRAP_ADMIN_EMAIL admin when the email is
  # verified, so this mapping vouches for the seeded dev accounts' emails.
  - model: authentik_providers_oauth2.scopemapping
    id: email-verified
    identifiers:
      name: Golden Portal email (verified)
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {"email": request.user.email, "email_verified": True}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Golden Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # The email is the subject, so deps/seed.sql can create users that match
      # their first sign-in.
      sub_mode: user_email
      grant_types: [authorization_code, refresh_token]
      client_id: golden-portal-dev
      client_secret: golden-portal-dev-secret
      # Any localhost port, so the Vite dev server and a locally built binary both work.
      redirect_uris:
        - matching_mode: regex
          url: ^http://localhost:\d+/api/v1/auth/callback$
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.group
    id: platform-engineers
    identifiers:
      name: platform-engineers

  - model: authentik_core.group
    id: payments
    identifiers:
      name: payments

  - model: authentik_core.group
    id: search
    identifiers:
      name: search

  - model: authentik_core.user
    identifiers:
      username: member
    attrs:
      name: Dev Member
      email: member@example.com
      password: golden-portal-dev

  - model: authentik_core.user
    identifiers:
      username: builder
    attrs:
      name: Dev Builder
      email: builder@example.com
      password: golden-portal-dev
      groups:
        - !KeyOf platform-engineers

  - model: authentik_core.user
    identifiers:
      username: ada
    attrs:
      name: Ada Lovelace
      email: ada@example.com
      password: golden-portal-dev
      groups:
        - !KeyOf payments

  - model: authentik_core.user
    identifiers:
      username: grace
    attrs:
      name: Grace Hopper
      email: grace@example.com
      password: golden-portal-dev
      groups:
        - !KeyOf search
        - !KeyOf payments

  # Pushes people and groups to the portal's SCIM endpoint on the host. The
  # token matches GP_SCIM_TOKEN in configs/.dev.env.
  - model: authentik_providers_scim.scimprovider
    id: scim
    identifiers:
      name: Golden Portal SCIM
    attrs:
      url: http://host.docker.internal:47200/scim/v2
      token: golden-portal-dev-scim-token-not-for-production
      exclude_users_service_account: true
      # Only the portal's dev groups, not Authentik's own.
      group_filters:
        - !KeyOf platform-engineers
        - !KeyOf payments
        - !KeyOf search
      property_mappings:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/user]]
      property_mappings_group:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/group]]

  - model: authentik_core.application
    identifiers:
      slug: golden-portal
    attrs:
      name: Golden Portal
      provider: !KeyOf provider
      backchannel_providers:
        - !KeyOf scim
      meta_launch_url: http://localhost:47273/
