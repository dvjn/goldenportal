# Everything the local portal talks to that isn't the portal. ${NAME} is read
# from the environment, which deps.dev.yaml fills from configs/.dev.env.
listen: :47800

# Sign-in without passwords: the sign-in page lists the users below. The email
# is the subject, and deps/seed.sql loads the same people with their groups and
# roles, so keep the two in step.
sso:
  issuer: ${GP_OIDC_ISSUER}
  clients:
    - id: ${GP_OIDC_CLIENT_ID}
      secret: ${GP_OIDC_CLIENT_SECRET}
      # Any localhost port, so the Vite dev server and a locally built binary both work.
      redirect: ^http://localhost:\d+/api/web/auth/callback$
  users:
    - {email: admin@example.com, name: Dev Admin}
    - {email: member@example.com, name: Dev Member}
    - {email: builder@example.com, name: Dev Builder}
    - {email: ada@example.com, name: Ada Lovelace}
    - {email: grace@example.com, name: Grace Hopper}

# An operations API for the example actions, at /ops. Each endpoint waits a
# while and answers 503 that share of the time, so retries and failed runs
# show. Restart answers with a job that runs for a while before it's done.
ops:
  token: "${GP_SECRET_OPS}"
  endpoints:
    restart: {latency: {min: 1s, max: 4s}, fails: 0.25}
    scale: {latency: {min: 500ms, max: 2s}, fails: 0.3}
    repos: {latency: {min: 1s, max: 3s}, fails: 0.05}
    services: {latency: {min: 500ms, max: 2s}, fails: 0.05}
    incidents: {latency: {min: 300ms, max: 1500ms}, fails: 0.05}
  jobs: {min: 10s, max: 1m}

# Pushes each file to its integration with an ingestion token, as an external
# system would: the whole file as a complete push every so often, give or take
# the variance, and one of its items as an incremental push between.
push:
  api: http://localhost:${HTTP_PORT}
  integrations:
    - name: team-directory
      token: "${GP_DEV_TEAM_DIRECTORY_TOKEN}"
      file: payloads/team-directory.json
      complete: {every: 30m, variance: 10m}
      changes: {every: 5m, variance: 2m}

# A service registry the service-registry integration pulls, at /registry,
# which also sends it an event signed with the secret whenever a service
# deploys, leaves or comes back. billing-export is invalid on purpose, and
# legacy-reports is filtered out by the mapping.
registry:
  api: http://localhost:${HTTP_PORT}
  integration: service-registry
  secret: "${GP_SECRET_SERVICE_REGISTRY_SIGNING}"
  file: payloads/service-registry.json
  events: {every: 3m, variance: 1m}

# A deploy tracker for the http integration to pull, at /deploy-tracker. Each
# service deploys every so often, give or take the variance, and fails that
# share of the time. A new version goes to staging, and once it succeeds the
# next deployment promotes it. It answers with what changed since a time,
# including what dropped out, for incremental syncs.
tracker:
  token: "${GP_SECRET_DEPLOY_TRACKER}"
  takes: {min: 1m, max: 8m}
  services:
    - {name: payments-api, fails: 0.1, every: 40m, variance: 20m}
    - {name: ledger, fails: 0.05, every: 2h, variance: 1h}
    - {name: checkout-web, fails: 0.2, every: 25m, variance: 15m}
    - {name: search-api, fails: 0.1, every: 1h, variance: 30m}
    - {name: indexer, fails: 0.25, every: 3h, variance: 1h}
    - {name: auth-service, fails: 0.05, every: 4h, variance: 2h}
    - {name: postgres-proxy, fails: 0.02, every: 8h, variance: 4h}
    - {name: api-gateway, fails: 0.1, every: 90m, variance: 45m}
    - {name: feature-flags, fails: 0.15, every: 30m, variance: 20m}

# A GitLab instance for the gitlab integration to read, at /gitlab/api/v4,
# with the acme group and a subgroup for each team, whose projects are named
# for the services and whose members make the changes. It takes the token,
# an owner's access token with the api scope, and counts rateLimit requests a
# minute against it, sending GitLab's RateLimit headers. Something happens in
# a project every so often, sent as an event to the project's webhooks, which
# the integration's syncs set up, with their secret token in X-Gitlab-Token;
# pipelines and deployments finish after a while, which sends their events
# too.
gitlab:
  url: http://localhost:47800/gitlab
  token: "${GP_SECRET_GITLAB_TOKEN}"
  group: acme
  subgroups:
    payments: {members: [ada, grace], projects: [payments-api, ledger, checkout-web]}
    search: {members: [grace, linus], projects: [search-api, indexer]}
    identity: {members: [margaret, ada], projects: [auth-service]}
    platform: {members: [linus, ken], projects: [api-gateway]}
  rateLimit: 600
  events: {every: 2m, variance: 1m}
  pipelines: {min: 1m, max: 4m}
